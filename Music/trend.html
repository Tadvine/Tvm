<!DOCTYPE html>
<html dir="rtl" lang="fa">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
  <meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
  <meta content="no-cache" http-equiv="Pragma"/>

  <title>
   گلچین آهنگ&zwnj;های ترند
  </title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <style>
:root {
    color-scheme:dark;
    --bg:#0b0d12;
    --panel:#141821;
    --panel2:#1b202b;
    --line:#292f3b;
    --text:#f4f6fb;
    --muted:#9ca6b7;
    --accent:#6c8cff;
    --accent2:#4568ed;
    --danger:#ff7373;
    --player-h:112px
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Vazirmatn',Tahoma,sans-serif
}

body {
    background:radial-gradient(ellipse at top right,#1a2340 0,transparent 38%),var(--bg);
    color:var(--text);
    padding-bottom:calc(var(--player-h) + 28px);
    min-height:100vh
}

button {
    font:inherit
}

button:focus-visible,.track:focus-visible,.seekbar:focus-visible {
    outline:3px solid #a9b8ff;
    outline-offset:3px
}

.topbar {
    padding:20px 0 10px
}

.container {
    width:min(1120px,100% - 32px);
    margin-inline:auto
}

.brand {
    display:flex;
    align-items:center;
    gap:12px
}

.brand-icon {
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    border-radius:16px;
    background:linear-gradient(135deg,var(--accent),#9b67f4);
    font-size:21px;
    box-shadow:0 8px 26px #526fe344
}

.brand h1 {
    font-size:clamp(19px,3vw,27px);
    font-weight:800
}

.brand p {
    font-size:13px;
    color:var(--muted);
    margin-top:3px
}

.hero {
    display:grid;
    grid-template-columns:220px 1fr;
    gap:26px;
    align-items:center;
    margin:24px 0 22px;
    padding:22px;
    background:linear-gradient(135deg,#191f2d,#12151d);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:0 18px 45px #0002
}

.hero-cover {
    width:100%;
    aspect-ratio:1;
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(135deg,#2d3e78,#292039);
    display:grid;
    place-items:center
}

.hero-cover img {
    width:100%;
    height:100%;
    object-fit:cover
}

.hero-info .eyebrow {
    color:#a9b8ff;
    font-size:12px;
    font-weight:700;
    letter-spacing:.3px
}

.hero-info h2 {
    font-size:clamp(23px,4vw,35px);
    line-height:1.5;
    margin:7px 0
}

.hero-info p {
    color:var(--muted);
    line-height:1.9
}

.meta {
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    color:#c5ccda;
    font-size:13px;
    margin-top:17px
}

.meta span {
    display:flex;
    align-items:center;
    gap:7px
}

.section-head {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin:28px 2px 12px
}

.section-head h3 {
    font-size:18px
}

.section-head span {
    font-size:12px;
    color:var(--muted)
}

.tracks {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden
}

.track {
    display:grid;
    grid-template-columns:34px 46px minmax(0,1fr) auto 42px;
    gap:13px;
    align-items:center;
    padding:13px 16px;
    border-bottom:1px solid #ffffff0a;
    cursor:pointer;
    transition:background .18s;
    min-height:76px
}

.track:last-child {
    border-bottom:0
}

.track:hover {
    background:#ffffff08
}

.track.active {
    background:linear-gradient(90deg,#627dff22,#627dff08);
    box-shadow:inset -3px 0 var(--accent)
}

.track-number {
    color:#7f899b;
    text-align:center;
    font-size:13px
}

.track.active .track-number {
    color:#c1cbff
}

.track-art {
    width:46px;
    height:46px;
    border-radius:12px;
    overflow:hidden;
    background:#242b39;
    display:grid;
    place-items:center;
    color:#8b9cff
}

.track-art img {
    width:100%;
    height:100%;
    object-fit:cover
}

.track-copy {
    min-width:0
}

.track-title {
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px
}

.track-artist {
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
    min-height:18px
}

.track-duration {
    color:#9ba5b6;
    font-size:12px;
    direction:ltr;
    white-space:nowrap
}

.track-play {
    width:38px;
    height:38px;
    border:1px solid #ffffff12;
    border-radius:50%;
    background:#242b39;
    color:#e8ecff;
    display:grid;
    place-items:center;
    cursor:pointer
}

.track.active .track-play {
    background:var(--accent2);
    color:white;
    border-color:transparent
}

.empty-cover {
    display:none
}

.player {
    position:fixed;
    z-index:20;
    bottom:0;
    left:0;
    right:0;
    background:#11151df2;
    border-top:1px solid #ffffff16;
    box-shadow:0 -12px 40px #0005;
    backdrop-filter:blur(20px);
    padding:12px max(18px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));
    direction:ltr
}

.player-inner {
    width:min(1240px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:minmax(180px,1fr) auto minmax(230px,1.5fr);
    align-items:center;
    gap:24px
}

.now-playing {
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    direction:ltr
}

.now-art {
    width:56px;
    height:56px;
    flex:0 0 56px;
    border-radius:12px;
    background:#242b39;
    overflow:hidden;
    display:grid;
    place-items:center;
    color:#9baaff
}

.now-art img {
    width:100%;
    height:100%;
    object-fit:cover
}

.now-copy {
    min-width:0;
    direction:rtl;
    text-align:right
}

.now-title {
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.now-artist {
    font-size:11px;
    color:var(--muted);
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.controls {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px
}

.control {
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#e9edfa;
    display:grid;
    place-items:center;
    cursor:pointer;
    font-size:16px;
    transition:background .18s,transform .18s
}

.control:hover {
    background:#ffffff12
}

.control:active {
    transform:scale(.94)
}

.control.main {
    width:48px;
    height:48px;
    background:#f4f6ff;
    color:#10131a;
    font-size:18px
}

.timeline {
    min-width:0;
    display:grid;
    grid-template-columns:42px minmax(0,1fr) 42px;
    align-items:center;
    gap:9px
}

.time {
    font-size:11px;
    color:#aeb7c8;
    direction:ltr;
    text-align:center;
    font-variant-numeric:tabular-nums
}

.seekbar {
    height:24px;
    display:flex;
    align-items:center;
    cursor:pointer;
    touch-action:none;
    min-width:0
}

.seek-track {
    height:5px;
    background:#353c4b;
    width:100%;
    border-radius:99px;
    position:relative
}

.seek-fill {
    height:100%;
    width:0;
    background:linear-gradient(90deg,#8b9fff,var(--accent));
    border-radius:99px;
    position:relative
}

.seek-fill::after {
    content:"";
    position:absolute;
    right:-5px;
    top:50%;
    transform:translateY(-50%);
    width:11px;
    height:11px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 3px #6c8cff33;
    opacity:0;
    transition:opacity .15s
}

.seekbar:hover .seek-fill::after,.seekbar:focus-visible .seek-fill::after {
    opacity:1
}

.status {
    position:fixed;
    z-index:30;
    left:50%;
    bottom:calc(var(--player-h) + 12px);
    transform:translateX(-50%);
    max-width:calc(100% - 28px);
    padding:10px 16px;
    border:1px solid #ffffff20;
    border-radius:12px;
    background:#242a36;
    color:#f6f7fb;
    font-size:13px;
    box-shadow:0 8px 25px #0005;
    display:none;
    text-align:center
}

.status.show {
    display:block
}

.status.error {
    border-color:#ff737366;
    color:#ffd5d5
}

@media(max-width:800px) {
    :root {
    --player-h:166px
}

.container {
    width:calc(100% - 22px)
}

.hero {
    grid-template-columns:120px 1fr;
    gap:16px;
    padding:15px;
    border-radius:18px
}

.hero-cover {
    border-radius:14px
}

.hero-info h2 {
    font-size:22px
}

.hero-info p {
    font-size:13px
}

.meta {
    gap:12px;
    margin-top:10px
}

.player {
    padding:9px 12px calc(9px + env(safe-area-inset-bottom))
}

.player-inner {
    grid-template-columns:minmax(0,1fr) auto;
    gap:5px 12px
}

.now-playing {
    grid-column:1;
    grid-row:1
}

.now-art {
    width:44px;
    height:44px;
    flex-basis:44px
}

.controls {
    grid-column:2;
    grid-row:1;
    gap:0
}

.control {
    width:35px;
    height:35px;
    font-size:14px
}

.control.main {
    width:42px;
    height:42px;
    font-size:16px
}

.timeline {
    grid-column:1 / -1;
    grid-row:2;
    width:100%;
    gap:8px
}

.status {
    bottom:calc(var(--player-h) + 8px)
}

}

@media(max-width:420px) {
    .hero {
    grid-template-columns:92px 1fr;
    padding:12px;
    gap:12px
}

.hero-info h2 {
    font-size:18px
}

.hero-info p {
    font-size:12px;
    line-height:1.7
}

.hero-info .eyebrow {
    font-size:10px
}

.track {
    grid-template-columns:24px 40px minmax(0,1fr) 38px;
    gap:9px;
    padding:11px 10px
}

.track-art {
    width:40px;
    height:40px
}

.track-play {
    display:none
}

.track-title {
    font-size:13px
}

.track-duration {
    font-size:11px
}

.now-title {
    font-size:12px
}

.now-artist {
    font-size:10px
}

.player-inner {
    gap:4px 8px
}

}

@media(prefers-reduced-motion:reduce) {
    * {
    transition:none!important
}

}
</style>
 </head>

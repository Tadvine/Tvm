<!doctype html>
<html lang="fa-IR" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Live TV</title>
  <style>
    :root { color-scheme: dark; --accent: #fff; --panel: rgba(18,18,18,.86); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f0f0f0; font-family: Arial, Tahoma, sans-serif; }
    body { display: grid; place-items: center; padding: 12px; }
    .main { width: min(100%, 1280px); margin: auto; }
    .video-container { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 10px; isolation: isolate; }
    .video-player { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; outline: none; }
    .video-container:fullscreen { width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto; border-radius: 0; }
    .video-container:fullscreen .video-player { width: 100%; height: 100%; }
    .video-container:-webkit-full-screen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; }
    .center-play { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; border: 0; padding: 0; background: transparent; color: #fff; cursor: pointer; transition: opacity .22s ease, visibility .22s ease; }
    .center-play .play-shape { display: grid; place-items: center; width: clamp(62px, 9vw, 92px); height: clamp(62px, 9vw, 92px); border-radius: 50%; background: rgba(0,0,0,.62); border: 2px solid rgba(255,255,255,.92); box-shadow: 0 2px 18px rgba(0,0,0,.3); }
    .center-play svg { width: 35%; height: 35%; fill: currentColor; margin-right: -3px; }
    .video-container.is-playing .center-play { opacity: 0; visibility: hidden; pointer-events: none; }
    .controls { position: absolute; z-index: 4; inset-inline: 0; bottom: 0; padding: 42px 12px 10px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.88)); opacity: 1; visibility: visible; transition: opacity .25s ease, visibility .25s ease; }
    .video-container.controls-hidden .controls { opacity: 0; visibility: hidden; pointer-events: none; }
    .video-container.controls-hidden { cursor: none; }
    .control-row { display: flex; align-items: center; gap: 10px; direction: ltr; }
    .control-button { flex: 0 0 auto; display: inline-grid; place-items: center; min-width: 40px; min-height: 40px; padding: 7px; border: 0; border-radius: 6px; color: #fff; background: transparent; cursor: pointer; }
    .control-button:hover, .control-button:focus-visible { background: rgba(255,255,255,.2); outline: 2px solid #fff; outline-offset: -2px; }
    .control-button svg { width: 23px; height: 23px; fill: currentColor; }
    .seek-wrap { flex: 1 1 auto; min-width: 25px; display: flex; align-items: center; }
    input[type="range"] { width: 100%; accent-color: #fff; cursor: pointer; }
    .time { font-size: 13px; white-space: nowrap; direction: ltr; font-variant-numeric: tabular-nums; }
    .status { position: absolute; z-index: 5; top: 12px; left: 12px; max-width: calc(100% - 24px); padding: 8px 12px; border-radius: 6px; color: #fff; background: rgba(0,0,0,.75); font-size: 14px; opacity: 0; visibility: hidden; transition: opacity .2s; pointer-events: none; }
    .status.visible { opacity: 1; visibility: visible; }
    .video-container:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    @media (max-width: 600px) {
      body { padding: 0; align-content: start; }
      .main { width: 100%; }
      .video-container { border-radius: 0; }
      .controls { padding: 32px 6px 5px; }
      .control-row { gap: 3px; }
      .control-button { min-width: 34px; min-height: 36px; padding: 5px; }
      .control-button svg { width: 20px; height: 20px; }
      .time { font-size: 11px; }
    }
    @media (orientation: portrait) and (max-width: 600px) {
      .video-container { aspect-ratio: 16 / 9; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="main">
    <section class="video-container" id="videoContainer" tabindex="0" aria-label="پخش‌کننده ویدیو">
      <video class="video-player" id="videoPlayer" playsinline preload="metadata"
      
      
       poster="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQ3cADaGLZWDun47JLOyKV-3EGGCg64pqA4OW4hjY4-w&s=10">
       
       
       
       
        <source src="https://www.googleapis.com/drive/v3/files/1xfrB9aEruyyZM0IYZa8Dsy-x3JbDnIOA?alt=media&key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU" type="video/mp4">
   
   
   
   
   
        مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
      </video>
      <button class="center-play" id="centerPlay" type="button" aria-label="پخش ویدیو">
        <span class="play-shape"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
      </button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="controls" id="controls">
        <div class="control-row">
          <button class="control-button" id="playPause" type="button" aria-label="پخش" title="پخش / توقف">
            <svg id="playPauseIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <span class="time" id="currentTime">0:00</span>
          <div class="seek-wrap"><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="موقعیت ویدیو" /></div>
          <span class="time" id="duration">0:00</span>
          <button class="control-button" id="mute" type="button" aria-label="قطع صدا" title="صدا">
            <svg id="volumeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05a4.5 4.5 0 0 0 2.5-4.02zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
          <button class="control-button" id="fullscreen" type="button" aria-label="تمام‌صفحه" title="تمام‌صفحه">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>
<script>
(() => {
  const container = document.getElementById('videoContainer');
  const video = document.getElementById('videoPlayer');
  const centerPlay = document.getElementById('centerPlay');
  const playPause = document.getElementById('playPause');
  const playPauseIcon = document.getElementById('playPauseIcon');
  const seek = document.getElementById('seek');
  const currentTime = document.getElementById('currentTime');
  const duration = document.getElementById('duration');
  const mute = document.getElementById('mute');
  const volumeIcon = document.getElementById('volumeIcon');
  const fullscreen = document.getElementById('fullscreen');
  const status = document.getElementById('status');
  let hideTimer = null;
  let statusTimer = null;
  let seeking = false;

  const playIcon = '<path d="M8 5v14l11-7z"/>';
  const pauseIcon = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  const volumeOn = '<path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05a4.5 4.5 0 0 0 2.5-4.02zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>';
  const volumeOff = '<path d="M3 9v6h4l5 4V5L7 9H3zm13.59 3 3.29 3.29-1.41 1.41L15.17 13.4l-3.3 3.3v-2.83l1.88-1.88-1.88-1.88V7.28l3.3 3.3 3.29-3.3 1.41 1.42L16.59 12z"/>';

  function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
    const s = Math.floor(seconds);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
  }
  function showStatus(message) {
    status.textContent = message;
    status.classList.add('visible');
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => status.classList.remove('visible'), 4000);
  }
  function showControls() {
    container.classList.remove('controls-hidden');
    clearTimeout(hideTimer);
    if (!video.paused && !video.ended) {
      hideTimer = setTimeout(() => {
        if (!video.paused && !video.ended && !seeking) container.classList.add('controls-hidden');
      }, 3000);
    }
  }
  function updatePlayState() {
    const playing = !video.paused && !video.ended;
    container.classList.toggle('is-playing', playing);
    playPauseIcon.innerHTML = playing ? pauseIcon : playIcon;
    playPause.setAttribute('aria-label', playing ? 'توقف' : 'پخش');
    centerPlay.setAttribute('aria-label', playing ? 'ویدیو در حال پخش است' : 'پخش ویدیو');
    if (playing) showControls(); else { clearTimeout(hideTimer); container.classList.remove('controls-hidden'); }
  }
  async function togglePlay() {
    if (video.paused || video.ended) {
      try { await video.play(); }
      catch (e) { showStatus('پخش انجام نشد؛ دسترسی لینک ویدیو را بررسی کنید.'); }
    } else video.pause();
  }
  function updateSeek() {
    if (!seeking && Number.isFinite(video.duration) && video.duration > 0) seek.value = String(Math.round(video.currentTime / video.duration * 1000));
    currentTime.textContent = formatTime(video.currentTime);
    duration.textContent = formatTime(video.duration);
  }
  function toggleMute() {
    video.muted = !video.muted;
    volumeIcon.innerHTML = video.muted ? volumeOff : volumeOn;
    mute.setAttribute('aria-label', video.muted ? 'فعال‌کردن صدا' : 'قطع صدا');
  }
  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else if (container.requestFullscreen) await container.requestFullscreen();
      else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      else showStatus('تمام‌صفحه در این مرورگر پشتیبانی نمی‌شود.');
    } catch (e) { showStatus('ورود به حالت تمام‌صفحه ممکن نشد.'); }
  }

  centerPlay.addEventListener('click', togglePlay);
  playPause.addEventListener('click', togglePlay);
  mute.addEventListener('click', toggleMute);
  fullscreen.addEventListener('click', toggleFullscreen);
  video.addEventListener('click', () => { showControls(); if (!video.paused) togglePlay(); });
  video.addEventListener('play', updatePlayState);
  video.addEventListener('pause', updatePlayState);
  video.addEventListener('ended', updatePlayState);
  video.addEventListener('timeupdate', updateSeek);
  video.addEventListener('loadedmetadata', updateSeek);
  video.addEventListener('durationchange', updateSeek);
  video.addEventListener('waiting', () => showStatus('در حال بارگذاری ویدیو…'));
  video.addEventListener('playing', () => status.classList.remove('visible'));
  video.addEventListener('error', () => showStatus('خطا در بارگذاری ویدیو؛ لینک یا مجوز دسترسی را بررسی کنید.'));
  seek.addEventListener('input', () => {
    seeking = true;
    if (Number.isFinite(video.duration) && video.duration > 0) currentTime.textContent = formatTime(Number(seek.value) / 1000 * video.duration);
    showControls();
  });
  seek.addEventListener('change', () => {
    if (Number.isFinite(video.duration) && video.duration > 0) video.currentTime = Number(seek.value) / 1000 * video.duration;
    seeking = false;
    showControls();
  });
  seek.addEventListener('focus', () => { seeking = true; showControls(); });
  seek.addEventListener('blur', () => { seeking = false; showControls(); });

  ['pointermove','pointerdown','mousemove','touchstart'].forEach(eventName => {
    container.addEventListener(eventName, showControls, { passive: true });
  });
  container.addEventListener('focusin', showControls);
  container.addEventListener('keydown', (event) => {
    const target = event.target;
    const tag = target && target.tagName ? target.tagName.toLowerCase() : '';
    if (tag === 'input' && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) return;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','k','f','m'].includes(event.key)) showControls();
    if (event.key === ' ' || event.key === 'Enter') {
      if (tag === 'button') return;
      event.preventDefault(); togglePlay();
    } else if (event.key === 'ArrowLeft' && Number.isFinite(video.duration)) {
      event.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10);
    } else if (event.key === 'ArrowRight' && Number.isFinite(video.duration)) {
      event.preventDefault(); video.currentTime = Math.min(video.duration, video.currentTime + 10);
    } else if (event.key === 'ArrowUp') {
      event.preventDefault(); video.volume = Math.min(1, video.volume + .1); video.muted = false; volumeIcon.innerHTML = volumeOn;
    } else if (event.key === 'ArrowDown') {
      event.preventDefault(); video.volume = Math.max(0, video.volume - .1); if (video.volume === 0) video.muted = true; volumeIcon.innerHTML = video.muted ? volumeOff : volumeOn;
    } else if (event.key.toLowerCase() === 'm') toggleMute();
    else if (event.key.toLowerCase() === 'f') toggleFullscreen();
  });
  document.addEventListener('fullscreenchange', showControls);
  document.addEventListener('webkitfullscreenchange', showControls);
  updatePlayState();
})();
</script>
</body>
</html>

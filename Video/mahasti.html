<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>مهستی | پخش‌کننده ویدیو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111;--panel:#202020;--text:#fff;--muted:#c7c7c7;--accent:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Noto Kufi Arabic',sans-serif;background:#111;color:var(--text)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:clamp(10px,2.5vw,24px);gap:14px}
.page-title{margin:0;font-size:clamp(18px,3vw,26px);font-weight:700;text-align:center}
.video-container{position:relative;width:min(100%,1000px);aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 5px 22px #0008;isolation:isolate}
#videoPlayer{display:block;width:100%;height:100%;object-fit:contain;background:#000;outline:none}
.video-container:fullscreen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;border-radius:0;display:flex;align-items:center;justify-content:center}
.video-container:fullscreen #videoPlayer{width:100%;height:100%;object-fit:contain}
.video-container:-webkit-full-screen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;border-radius:0}
.video-container:-webkit-full-screen #videoPlayer{width:100%;height:100%;object-fit:contain}
.big-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(58px,9vw,88px);height:clamp(58px,9vw,88px);border:2px solid #ffffffd9;border-radius:50%;background:#0009;color:#fff;display:grid;place-items:center;cursor:pointer;z-index:3;transition:opacity .22s,transform .22s,visibility .22s;padding:0}
.big-play svg{width:38%;height:38%;fill:currentColor;margin-right:3px}
.big-play.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:translate(-50%,-50%) scale(.92)}
.controls{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:36px 14px 12px;background:linear-gradient(transparent,#000d 45%,#000f);opacity:1;visibility:visible;transition:opacity .25s,visibility .25s;direction:ltr}
.video-container.controls-hidden .controls{opacity:0;visibility:hidden;pointer-events:none}
.video-container.controls-hidden .big-play.hidden{opacity:0;visibility:hidden}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;color:#fff;font:12px Arial,sans-serif;direction:ltr}
.time{white-space:nowrap;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:#fff;cursor:pointer}
#seek{width:100%;height:5px;margin:0;min-width:0}
.control-row{display:flex;align-items:center;gap:12px;color:#fff;direction:ltr}
.control-btn{border:0;background:transparent;color:#fff;min-width:38px;min-height:38px;padding:6px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer}
.control-btn:hover,.control-btn:focus-visible{background:#ffffff2b;outline:2px solid #ffffff99;outline-offset:1px}
.control-btn svg{width:23px;height:23px;fill:currentColor}
#volume{width:clamp(55px,10vw,110px);height:5px}
.spacer{flex:1}
.dropdown{width:min(100%,1000px)}
.dropdown label{display:block;font-size:14px;margin:0 0 7px;color:#ddd}
#videoList{font-family:inherit;width:100%;padding:12px 14px;font-size:clamp(14px,2.2vw,16px);border:1px solid #555;border-radius:8px;background:#222;color:#fff;direction:rtl;text-align:right;outline-offset:3px}
#status{width:min(100%,1000px);min-height:1.5em;text-align:center;color:#ddd;font-size:13px}
#status.error{color:#ffb4b4}
@media(max-width:600px){body{padding:10px;gap:12px}.video-container{border-radius:8px}.controls{padding:28px 8px 7px}.control-row{gap:5px}.control-btn{min-width:34px;min-height:34px}.control-btn svg{width:20px;height:20px}.time{min-width:35px;font-size:11px}#volume{width:58px}}
@media(orientation:landscape) and (max-height:500px){body{padding:4px;gap:5px}.page-title{font-size:14px}.video-container{width:min(100%,calc((100dvh - 55px)*16/9));max-height:calc(100dvh - 55px)}.dropdown{width:min(100%,700px)}body:has(.video-container:fullscreen){padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1 class="page-title">مهستی</h1>
<div class="video-container" id="videoContainer">
  <video id="videoPlayer" playsinline preload="metadata">
    <source src="https://www.googleapis.com/drive/v3/files/1Q8mPMIYVI8zgL2n4PD9qHYImiSYLCl8b?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU" type="video/mp4">
    مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
  </video>
  <button class="big-play" id="bigPlay" aria-label="پخش" title="پخش">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="controls" id="controls">
    <div class="progress-row"><span class="time" id="currentTime">00:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="موقعیت پخش"><span class="time" id="duration">00:00</span></div>
    <div class="control-row">
      <button class="control-btn" id="playPause" aria-label="پخش" title="پخش / توقف">
        <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="control-btn" id="back10" aria-label="۱۰ ثانیه عقب" title="۱۰ ثانیه عقب"><svg viewBox="0 0 24 24"><path d="M11 5V1L5 6l6 5V7a6 6 0 1 1-5.65 8H3.23A8 8 0 1 0 11 5z"/><text x="12" y="16" font-size="7" fill="#111" stroke="none">10</text></svg></button>
      <button class="control-btn" id="forward10" aria-label="۱۰ ثانیه جلو" title="۱۰ ثانیه جلو"><svg viewBox="0 0 24 24"><path d="M13 5V1l6 5-6 5V7a6 6 0 1 0 5.65 8h2.12A8 8 0 1 1 13 5z"/></svg></button>
      <button class="control-btn" id="mute" aria-label="بی‌صدا" title="صدا"><svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a3.5 3.5 0 0 0-2-3.16v6.31a3.5 3.5 0 0 0 2-3.15zM14.5 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg></button>
      <input id="volume" type="range" min="0" max="1" value="1" step="0.05" aria-label="میزان صدا">
      <span class="spacer"></span>
      <button class="control-btn" id="next" aria-label="آهنگ بعدی" title="آهنگ بعدی"><svg viewBox="0 0 24 24"><path d="M5 5v14l11-7zM18 5h2v14h-2z"/></svg></button>
      <button class="control-btn" id="fullscreen" aria-label="تمام‌صفحه" title="تمام‌صفحه"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </div>
</div>
<div class="dropdown"><label for="videoList">انتخاب آهنگ</label><select id="videoList">
<option value="https://www.googleapis.com/drive/v3/files/1Q8mPMIYVI8zgL2n4PD9qHYImiSYLCl8b?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ بنویس</option>
<option value="https://www.googleapis.com/drive/v3/files/120HtdRvl-M9n1hT3NpBibK9LTzctdLls?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ دلداده</option>
<option value="https://www.googleapis.com/drive/v3/files/17i5FFm-8jKADZpnal_npl1HdFeo0tGuD?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ طعنه</option>
<option value="https://www.googleapis.com/drive/v3/files/1cL3CtORHDtdGSNfWvp5i7yC-VdPCSZTN?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ یار جون جونی</option>
<option value="https://www.googleapis.com/drive/v3/files/1-6exaezF4LD16KpWPHmq8p-ixyYwAVuG?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ دل میگه</option>
<option value="https://www.googleapis.com/drive/v3/files/1BP3r-Ut-oIanze7BBCvgFdhEDZ8cWus9?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ غرور نشکستنی</option>
<option value="https://www.googleapis.com/drive/v3/files/1cWbe_99NvDnwjZxroNeXhgMgXvV691XT?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ حرف‌های قشنگ</option>
<option value="https://www.googleapis.com/drive/v3/files/1Ng4KhDz1zjl3JQJUYg1E-M2vUr-WnURE?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ خونه تکونی</option>
<option value="https://www.googleapis.com/drive/v3/files/1UrW9dotaLTq1DN0yCWtQgeTLRHuFltsw?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ مادر</option>
<option value="https://www.googleapis.com/drive/v3/files/1yXFl5tDhlcqowLnLLtVj5T9AAPKqYJdA?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ نازی نازی</option>
<option value="https://www.googleapis.com/drive/v3/files/11vrW3a8hkJBdBCU-K72qU0htOoNaZdHh?alt=media&amp;key=AIzaSyDzexTk_4tsYJJrsdeD-xImXZfAke264AU">مهستی ■ سایه</option>
</select></div>
<div id="status" role="status" aria-live="polite"></div>
<script>
(() => {
  const player = document.getElementById('videoPlayer');
  const container = document.getElementById('videoContainer');
  const list = document.getElementById('videoList');
  const bigPlay = document.getElementById('bigPlay');
  const playPause = document.getElementById('playPause');
  const playPauseIcon = document.getElementById('playPauseIcon');
  const seek = document.getElementById('seek');
  const currentTime = document.getElementById('currentTime');
  const duration = document.getElementById('duration');
  const volume = document.getElementById('volume');
  const mute = document.getElementById('mute');
  const volumeIcon = document.getElementById('volumeIcon');
  const status = document.getElementById('status');
  let hideTimer = null;
  let seeking = false;
  let lastVolume = 1;

  function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
    const s = Math.floor(seconds);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
  function showControls() {
    container.classList.remove('controls-hidden');
    clearTimeout(hideTimer);
    if (!player.paused && !player.ended) hideTimer = setTimeout(() => container.classList.add('controls-hidden'), 3000);
  }
  function syncPlayUI() {
    const playing = !player.paused && !player.ended;
    bigPlay.classList.toggle('hidden', playing);
    bigPlay.setAttribute('aria-label', playing ? 'در حال پخش' : 'پخش');
    playPause.setAttribute('aria-label', playing ? 'توقف' : 'پخش');
    playPauseIcon.innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    if (playing) showControls(); else { clearTimeout(hideTimer); container.classList.remove('controls-hidden'); }
  }
  async function togglePlay() {
    status.textContent = ''; status.classList.remove('error');
    if (player.paused) {
      try { await player.play(); } catch (e) { status.textContent = 'پخش شروع نشد؛ دسترسی فایل یا اتصال اینترنت را بررسی کن.'; status.classList.add('error'); showControls(); }
    } else player.pause();
  }
  function loadSelected(autoplay = true) {
    const selected = list.options[list.selectedIndex];
    if (!selected) return;
    status.textContent = 'در حال بارگذاری ویدیو…'; status.classList.remove('error');
    player.src = selected.value.replaceAll('&amp;', '&');
    player.load();
    if (autoplay) player.play().catch(() => { status.textContent = 'برای شروع پخش، دکمه پخش را انتخاب کن. اگر همچنان پخش نشد، دسترسی لینک را بررسی کن.'; status.classList.remove('error'); });
  }
  bigPlay.addEventListener('click', togglePlay);
  playPause.addEventListener('click', togglePlay);
  list.addEventListener('change', () => loadSelected(true));
  document.getElementById('back10').addEventListener('click', () => { if (Number.isFinite(player.duration)) player.currentTime = Math.max(0, player.currentTime - 10); showControls(); });
  document.getElementById('forward10').addEventListener('click', () => { if (Number.isFinite(player.duration)) player.currentTime = Math.min(player.duration, player.currentTime + 10); showControls(); });
  document.getElementById('next').addEventListener('click', () => { list.selectedIndex = (list.selectedIndex + 1) % list.options.length; loadSelected(true); });
  seek.addEventListener('input', () => { seeking = true; if (Number.isFinite(player.duration)) currentTime.textContent = formatTime(Number(seek.value) / 1000 * player.duration); });
  seek.addEventListener('change', () => { if (Number.isFinite(player.duration)) player.currentTime = Number(seek.value) / 1000 * player.duration; seeking = false; showControls(); });
  volume.addEventListener('input', () => { player.volume = Number(volume.value); player.muted = player.volume === 0; if (player.volume > 0) lastVolume = player.volume; volumeIcon.innerHTML = player.muted ? '<path d="M3 9v6h4l5 4V5L7 9H3zm13.6 0L15.2 10.4 17.8 13l-2.6 2.6 1.4 1.4 2.6-2.6 2.6 2.6 1.4-1.4-2.6-2.6 2.6-2.6-1.4-1.4-2.6 2.6z"/>' : '<path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a3.5 3.5 0 0 0-2-3.16v6.31a3.5 3.5 0 0 0 2-3.15zM14.5 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>'; showControls(); });
  mute.addEventListener('click', () => { if (player.muted || player.volume === 0) { player.muted = false; player.volume = lastVolume || 1; volume.value = player.volume; } else { lastVolume = player.volume; player.muted = true; volume.value = 0; } volume.dispatchEvent(new Event('input')); });
  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (container.requestFullscreen) await container.requestFullscreen(); else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen(); else if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
      } else if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) { status.textContent = 'تمام‌صفحه در این مرورگر پشتیبانی نمی‌شود.'; }
    showControls();
  }
  document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
  player.addEventListener('play', syncPlayUI);
  player.addEventListener('pause', syncPlayUI);
  player.addEventListener('ended', () => { list.selectedIndex = (list.selectedIndex + 1) % list.options.length; loadSelected(true); });
  player.addEventListener('loadedmetadata', () => { duration.textContent = formatTime(player.duration); status.textContent = ''; seek.value = '0'; });
  player.addEventListener('timeupdate', () => { currentTime.textContent = formatTime(player.currentTime); if (!seeking && Number.isFinite(player.duration) && player.duration > 0) seek.value = String(Math.round(player.currentTime / player.duration * 1000)); });
  player.addEventListener('waiting', () => { if (!player.paused) status.textContent = 'در حال دریافت ویدیو…'; });
  player.addEventListener('playing', () => { status.textContent = ''; status.classList.remove('error'); syncPlayUI(); });
  player.addEventListener('error', () => { status.textContent = 'ویدیو بارگذاری نشد. ممکن است لینک، مجوز دسترسی یا محدودیت Google Drive مانع پخش باشد.'; status.classList.add('error'); syncPlayUI(); });
  ['mousemove','pointermove','touchstart','click','keydown'].forEach(evt => container.addEventListener(evt, showControls, {passive:true}));
  document.addEventListener('fullscreenchange', showControls);
  document.addEventListener('webkitfullscreenchange', showControls);
  // پشتیبانی پایه از ریموت تلویزیون و صفحه‌کلید
  document.addEventListener('keydown', e => {
    if (e.target === list || e.target === seek || e.target === volume) return;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' ','MediaPlayPause','MediaPlay','MediaPause','f','F','m','M'].includes(e.key)) showControls();
    if (e.key === ' ' || e.key === 'MediaPlayPause' || e.key === 'MediaPlay' || e.key === 'MediaPause' || e.key === 'Enter') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); player.currentTime = Math.max(0, player.currentTime - 10); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (Number.isFinite(player.duration)) player.currentTime = Math.min(player.duration, player.currentTime + 10); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); player.volume = Math.min(1, player.volume + .05); volume.value = player.volume; player.muted = false; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); player.volume = Math.max(0, player.volume - .05); volume.value = player.volume; }
    else if (e.key.toLowerCase() === 'f') toggleFullscreen();
    else if (e.key.toLowerCase() === 'm') { player.muted = !player.muted; volume.value = player.muted ? 0 : player.volume; }
  });
  // مقدار اولیه از نخستین گزینه گرفته می‌شود؛ autoplay ممکن است توسط مرورگر مسدود شود.
  player.src = list.options[0].value.replaceAll('&amp;', '&');
  player.load();
  player.play().catch(() => { status.textContent = 'برای پخش، دکمه سفید وسط تصویر را انتخاب کن.'; });
  syncPlayUI();
})();
</script>
</body>
</html>

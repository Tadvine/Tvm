<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>LiveTv | پخش زنده</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <style>
        /* ----- reset & base (Smart TV UI) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #f5c842;
            --gold-dim: rgba(245, 200, 66, 0.18);
            --glass: rgba(10, 10, 10, 0.55);
            --glass-border: rgba(255, 255, 255, 0.06);
            --shadow-soft: 0 12px 40px rgba(0, 0, 0, 0.6);
            --radius-card: 20px;
            --transition-smooth: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', system-ui, sans-serif;
            background: #0b0b0b url("https://bayanbox.ir/download/1793887276848709656/Background.jpg") center/cover fixed;
            color: #f0f0f0;
            min-height: 100vh;
            padding-bottom: 130px;
            /* فضای منوی پایین */
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ----- نوار بالایی (ساعت/تاریخ) شیشه‌ای ----- */
        #info-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 4vw, 40px);
            background: var(--glass);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #info-bar .time {
            font-size: clamp(1.1rem, 2.8vw, 1.8rem);
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(245, 200, 66, 0.15);
        }

        #day-name {
            font-size: clamp(0.8rem, 1.8vw, 1.2rem);
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.3rem 1.4rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            color: #eaeaea;
        }

        #info-bar .date {
            font-size: clamp(0.8rem, 1.8vw, 1.2rem);
            color: #b0b0b0;
        }

        /* ----- اسلایدشو (نسبت درست + fade) ----- */
        #slideshow {
            position: relative;
            width: 100%;
            height: clamp(180px, 38vh, 460px);
            margin-top: 64px;
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
            z-index: 95;
            border-bottom: 1px solid rgba(255, 215, 0, 0.04);
        }

        #slideshow.hidden {
            display: none;
        }

        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.2s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        .slide-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .slide-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* حفظ نسبت تصویر */
            object-position: center;
            filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.7));
            background: #0a0a0a;
        }

        .slideshow-controls {
            position: absolute;
            bottom: clamp(10px, 2.5vh, 20px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: clamp(8px, 1.5vw, 16px);
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            padding: clamp(4px, 0.8vw, 10px) clamp(10px, 2vw, 24px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 5;
        }

        .slideshow-dot {
            width: clamp(8px, 1.2vw, 14px);
            height: clamp(8px, 1.2vw, 14px);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
        }

        .slideshow-dot.active {
            background: var(--gold);
            transform: scale(1.35);
            box-shadow: 0 0 24px rgba(245, 200, 66, 0.5);
        }

        /* ----- بخش‌های محتوا (کارت‌های شیشه‌ای) ----- */
        .content-section {
            display: none;
            z-index: 90;
            padding: clamp(16px, 3vw, 36px) clamp(12px, 2vw, 28px);
            margin: 16px auto 24px;
            max-width: 1440px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px) saturate(1.1);
            -webkit-backdrop-filter: blur(10px) saturate(1.1);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: var(--shadow-soft);
        }

        .content-section.active {
            display: block;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .section-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: clamp(1.4rem, 4vw, 2.6rem);
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 2px 20px rgba(245, 200, 66, 0.12);
            margin-bottom: clamp(12px, 2vh, 24px);
            letter-spacing: 0.5px;
            position: relative;
        }

        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            margin: 6px auto 0;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 6px;
        }

        /* ----- گالری تصاویر (کارت‌های سینمایی) ----- */
        .image-gallery-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 4px;
        }

        .image-gallery {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: clamp(8px, 1.5vw, 20px) 4px clamp(16px, 2.5vw, 32px);
            gap: clamp(14px, 2.2vw, 30px);
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            align-items: stretch;
            scrollbar-width: none;
        }

        .image-gallery::-webkit-scrollbar {
            display: none;
        }

        .image-gallery a {
            scroll-snap-align: start;
            flex: 0 0 auto;
            text-decoration: none;
            border-radius: var(--radius-card);
            background: rgba(255, 255, 255, 0.02);
            padding: 6px;
            border: 1px solid transparent;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .image-gallery a:hover,
        .image-gallery a:focus-visible {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(245, 200, 66, 0.3);
            background: rgba(245, 200, 66, 0.04);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(245, 200, 66, 0.05);
            outline: none;
        }

        .image-gallery img {
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            transition: var(--transition-smooth);
            width: clamp(110px, 16vw, 220px);
            height: clamp(150px, 22vw, 300px);
            object-fit: cover;
            background: #111;
            border: 2px solid rgba(255, 255, 255, 0.04);
            aspect-ratio: 2 / 3;
        }

        #tvGallery img {
            aspect-ratio: 16 / 10;
            height: auto;
            width: clamp(120px, 16vw, 200px);
            border-radius: 14px;
        }

        .image-gallery img:hover {
            border-color: var(--gold);
            box-shadow: 0 0 40px rgba(245, 200, 66, 0.08);
        }

        /* دکمه‌های اسکرول (شیشه‌ای) */
        .scroll-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--gold);
            width: clamp(32px, 4vw, 56px);
            height: clamp(44px, 6vw, 76px);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 2vw, 1.8rem);
            cursor: pointer;
            z-index: 5;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .scroll-button:hover {
            background: rgba(245, 200, 66, 0.12);
            border-color: var(--gold);
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 0 40px rgba(245, 200, 66, 0.06);
        }

        .scroll-button.left {
            right: -6px;
        }
        .scroll-button.right {
            left: -6px;
        }

        /* ----- منوی پایین (شیشه‌ای + آیکون) ----- */
        .container {
            display: flex;
            width: 100%;
            height: clamp(72px, 12vh, 140px);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px) saturate(1.3);
            -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
            padding: 0 4px;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        .box {
            flex: 1 0 auto;
            min-width: clamp(48px, 8vw, 80px);
            height: 100%;
            transform: skewX(-8deg);
            transition: var(--transition-smooth);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(60, 60, 60, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 0;
        }

        .box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 80%);
            pointer-events: none;
        }

        .box:last-child {
            border-right: none;
        }

        .box.active {
            flex-grow: 1.6;
            transform: skewX(-8deg) translateY(-12px) scale(1.02);
            z-index: 10;
            background: rgba(245, 200, 66, 0.06);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(245, 200, 66, 0.2);
            border-radius: 4px 4px 0 0;
        }

        .box.active .box-content {
            color: var(--gold);
            text-shadow: 0 0 30px rgba(245, 200, 66, 0.1);
        }

        .box-content {
            transform: skewX(8deg);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-weight: 500;
            font-size: clamp(0.5rem, 1vw, 0.85rem);
            color: #c8c8c8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            text-align: center;
            padding: 0 4px;
            transition: var(--transition-smooth);
            letter-spacing: 0.2px;
        }

        .box-content i {
            font-size: clamp(1.1rem, 2.2vw, 1.8rem);
            color: #d0d0d0;
            transition: var(--transition-smooth);
        }

        .box.active .box-content i {
            color: var(--gold);
            text-shadow: 0 0 20px rgba(245, 200, 66, 0.15);
        }

        .box:hover .box-content {
            color: #fff;
        }

        .box:hover .box-content i {
            color: #fff;
        }

        /* رنگ‌بندی ملایم برای هر باکس (حالت غیرفعال) */
        .box:nth-child(1) {
            background: rgba(50, 50, 50, 0.2);
        }
        .box:nth-child(2) {
            background: rgba(58, 58, 58, 0.2);
        }
        .box:nth-child(3) {
            background: rgba(66, 66, 66, 0.2);
        }
        .box:nth-child(4) {
            background: rgba(74, 74, 74, 0.2);
        }
        .box:nth-child(5) {
            background: rgba(82, 82, 82, 0.2);
        }
        .box:nth-child(6) {
            background: rgba(90, 90, 90, 0.2);
        }
        .box:nth-child(7) {
            background: rgba(98, 98, 98, 0.2);
        }
        .box:nth-child(8) {
            background: rgba(106, 106, 106, 0.2);
        }
        .box:nth-child(9) {
            background: rgba(114, 114, 114, 0.2);
        }
        .box:nth-child(10) {
            background: rgba(122, 122, 122, 0.2);
        }

        /* ----- حالت فوکوس برای کنترل با کیبورد/ریموت ----- */
        .box:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: -2px;
        }

        .image-gallery a:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 4px;
        }

        /* ----- ریسپانسیو کامل با clamp و flex مدرن (بدون Media Query اضافه) ----- */
        @media (max-width: 600px) {
            .box-content span {
                display: none;
            }
            .box-content i {
                font-size: 1.4rem;
            }
            .box {
                min-width: 44px;
            }
            .container {
                gap: 0;
                padding: 0 2px;
            }
            .box.active {
                transform: skewX(-6deg) translateY(-8px);
            }
            .box-content {
                transform: skewX(6deg);
            }
        }

        @media (max-width: 400px) {
            #info-bar {
                height: 52px;
                padding: 0 8px;
            }
            #slideshow {
                margin-top: 52px;
                height: 140px;
            }
            .content-section {
                padding: 12px 6px;
                border-radius: 18px;
                margin: 8px 4px;
            }
            .image-gallery img {
                width: 80px;
                height: 110px;
            }
            #tvGallery img {
                width: 80px;
                height: 52px;
            }
            .slideshow-controls {
                padding: 4px 10px;
                gap: 6px;
            }
            .slideshow-dot {
                width: 6px;
                height: 6px;
            }
            .scroll-button {
                width: 24px;
                height: 32px;
                font-size: 0.7rem;
            }
            .scroll-button.left {
                right: 0px;
            }
            .scroll-button.right {
                left: 0px;
            }
            .box-content i {
                font-size: 1.1rem;
            }
            .box {
                min-width: 36px;
            }
            .container {
                height: 62px;
            }
            body {
                padding-bottom: 70px;
            }
        }

        @media (min-width: 1400px) {
            .image-gallery img {
                width: 220px;
                height: 300px;
            }
            #tvGallery img {
                width: 200px;
                height: 130px;
            }
            #slideshow {
                height: 420px;
            }
        }

        @media (min-width: 2000px) {
            #slideshow {
                height: 520px;
            }
            .image-gallery img {
                width: 280px;
                height: 380px;
            }
            #tvGallery img {
                width: 240px;
                height: 160px;
            }
            .container {
                height: 150px;
            }
            .box-content {
                font-size: 1.1rem;
            }
            .box-content i {
                font-size: 2.2rem;
            }
        }

        /* برای تلویزیون‌های بزرگ (4K) */
        @media (min-width: 3000px) {
            #slideshow {
                height: 600px;
            }
            .image-gallery img {
                width: 340px;
                height: 460px;
            }
            #tvGallery img {
                width: 300px;
                height: 200px;
            }
            .container {
                height: 170px;
            }
            .box-content {
                font-size: 1.3rem;
            }
            .box-content i {
                font-size: 2.6rem;
            }
            #info-bar {
                height: 80px;
            }
            #info-bar .time {
                font-size: 2.4rem;
            }
            #day-name {
                font-size: 1.6rem;
                padding: 0.4rem 2rem;
            }
            #info-bar .date {
                font-size: 1.6rem;
            }
            .content-section {
                padding: 40px 48px;
                border-radius: 48px;
            }
            .slideshow-controls {
                padding: 12px 32px;
                gap: 20px;
            }
            .slideshow-dot {
                width: 18px;
                height: 18px;
            }
            .scroll-button {
                width: 72px;
                height: 96px;
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- بخش سریال‌های جدید -->

            <div class="image-gallery-container">

    <script>
        // ----- متغیرها -----
        let activeBox = null;
        let activeSection = null;
        let slideshowInterval;
        let slideIndex = 0;
        const slideshowTimeout = 7000;

        // ----- عدد به فارسی -----
        const toPersianNumber = num =>
            num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[parseInt(d)]);

        // ----- زمان و تاریخ -----
        function updateTime() {
            const now = new Date();
            const h = toPersianNumber(now.getHours().toString().padStart(2, '0'));
            const m = toPersianNumber(now.getMinutes().toString().padStart(2, '0'));
            document.getElementById('time').textContent = `${h}:${m}`;
        }

        function updatePersianDate() {
            const now = new Date();
            const day = new Intl.DateTimeFormat('fa-IR', { weekday: 'long' }).format(now);
            const date = new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
            document.getElementById('day-name').textContent = day;
            document.getElementById('date').textContent = date;
        }

        // ----- مدیریت بخش‌ها (سریال جدید / پخش زنده) -----
        function toggleSection(sectionId, boxElement, event) {
            event.preventDefault();
            hideSlideshow();

            if (activeBox === boxElement) {
                boxElement.classList.remove('active');
                activeBox = null;
                if (activeSection) {
                    document.getElementById(activeSection).classList.remove('active');
                    activeSection = null;
                }
                showSlideshow();
                return;
            }

            if (activeBox) activeBox.classList.remove('active');
            if (activeSection) document.getElementById(activeSection).classList.remove('active');

            boxElement.classList.add('active');
            activeBox = boxElement;

            if (sectionId) {
                document.getElementById(sectionId).classList.add('active');
                activeSection = sectionId;
            } else {
                activeSection = null;
            }
        }

        // ----- مدیریت کلیک روی باکس‌های دارای لینک -----
        function handleBoxClick(boxElement, event) {
            hideSlideshow();

            if (activeBox === boxElement) {
                boxElement.classList.remove('active');
                activeBox = null;
                if (activeSection) {
                    document.getElementById(activeSection).classList.remove('active');
                    activeSection = null;
                }
                showSlideshow();
                event.preventDefault();
            } else {
                if (activeBox) activeBox.classList.remove('active');
                if (activeSection) document.getElementById(activeSection).classList.remove('active');
                boxElement.classList.add('active');
                activeBox = boxElement;
                activeSection = null;
            }
        }

        // ----- کلیک خارج از بخش‌ها و منو (بستن) -----
        document.addEventListener('click', function(e) {
            const sections = document.querySelectorAll('.content-section');
            const boxes = document.querySelectorAll('.box');
            const scrolls = document.querySelectorAll('.scroll-button');

            let inside = false,
                onBox = false,
                onScroll = false;
            sections.forEach(s => { if (s.contains(e.target)) inside = true; });
            boxes.forEach(b => { if (b.contains(e.target)) onBox = true; });
            scrolls.forEach(s => { if (s.contains(e.target)) onScroll = true; });

            if (!inside && !onBox && !onScroll) {
                if (activeBox) { activeBox.classList.remove('active');
                    activeBox = null; }
                if (activeSection) {
                    document.getElementById(activeSection).classList.remove('active');
                    activeSection = null;
                }
                showSlideshow();
            }
        });

        // ----- اسکرول گالری (جهت: 1 = راست, -1 = چپ) -----
        function scrollGallery(id, dir) {
            const el = document.getElementById(id);
            if (!el) return;
            const step = el.querySelector('img') ? el.querySelector('img').offsetWidth + 24 : 180;
            el.scrollLeft += dir * step;
        }

        // ----- اسلایدشو -----
        function showSlideshow() {
            const el = document.getElementById('slideshow');
            el.classList.remove('hidden');
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.box').forEach(b => b.classList.remove('active'));
            activeBox = null;
            activeSection = null;
            startSlideshow();
        }

        function hideSlideshow() {
            document.getElementById('slideshow').classList.add('hidden');
            if (slideshowInterval) clearInterval(slideshowInterval);
        }

        function startSlideshow() {
            if (slideshowInterval) clearInterval(slideshowInterval);
            slideshowInterval = setInterval(nextSlide, slideshowTimeout);
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.slideshow-dot');
            if (!slides.length) return;
            slides[slideIndex].classList.remove('active');
            dots[slideIndex]?.classList.remove('active');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active');
            dots[slideIndex]?.classList.add('active');
        }

        // تغییر اسلاید با کلیک روی دات‌ها
        document.querySelectorAll('.slideshow-dot').forEach(dot => {
            dot.addEventListener('click', function(e) {
                const idx = parseInt(this.dataset.index);
                const slides = document.querySelectorAll('.slide');
                const dots = document.querySelectorAll('.slideshow-dot');
                if (!slides.length) return;
                slides[slideIndex].classList.remove('active');
                dots[slideIndex]?.classList.remove('active');
                slideIndex = idx;
                slides[slideIndex].classList.add('active');
                dots[slideIndex]?.classList.add('active');
                startSlideshow();
                e.stopPropagation();
            });
        });

        // ----- کنترل با کیبورد (جهت ریموت/تلویزیون) -----
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                const active = document.activeElement;
                if (active && active.closest('.image-gallery')) {
                    const gallery = active.closest('.image-gallery');
                    if (gallery) scrollGallery(gallery.id, 1);
                    e.preventDefault();
                }
            } else if (e.key === 'ArrowLeft') {
                const active = document.activeElement;
                if (active && active.closest('.image-gallery')) {
                    const gallery = active.closest('.image-gallery');
                    if (gallery) scrollGallery(gallery.id, -1);
                    e.preventDefault();
                }
            }
        });

        // ----- مقداردهی اولیه -----
        updateTime();
        updatePersianDate();
        showSlideshow();

        setInterval(updateTime, 60000);
        setInterval(updatePersianDate, 86400000);

        // پشتیبانی از Lazy loading با Intersection Observer (اختیاری)
        if ('IntersectionObserver' in window) {
            const lazyImages = document.querySelectorAll('img[loading="lazy"]');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.src; // trigger load
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '200px' });
            lazyImages.forEach(img => observer.observe(img));
        }
    </script>

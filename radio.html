<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#2c3e50">

    <title>کانال‌های رادیو</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            direction: rtl;
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            overflow-x: hidden;
        }


        /* سایدبار */

        .sidebar {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .sidebar h1 {
            font-size: 1.5rem;
            margin: 0 0 20px;
            text-align: center;
        }


        /* لیست کانال‌ها */

        .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .channel-list li {
            background-color: #34495e;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;

            transition: background-color 0.3s;
        }

        .channel-list li:hover {
            background-color: #40566c;
        }

        .channel-list li.active {
            background-color: #40566c;
            border-right: 3px solid #27ae60;
        }

        .channel-list span {
            font-size: 14px;
            line-height: 1.6;
        }

        .channel-list button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 9px 13px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            transition: background-color 0.3s;
        }

        .channel-list button:hover {
            background-color: #c0392b;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }


        /* محتوای اصلی */

        .main-content {
            min-width: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 25px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* پلیر */

        .player-container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            width: 100%;
            max-width: 600px;

            text-align: center;
        }

        .player-container h2 {
            font-size: 22px;
            margin: 0 0 20px;
            color: #2c3e50;
            overflow-wrap: anywhere;
        }

        .player {
            width: 100%;
            display: block;
            border-radius: 5px;
        }


        /* لوگوی رادیو */

        #radioLogo {
            width: 150px;
            height: 150px;
            max-width: 100%;
            object-fit: contain;

            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);

            margin: 20px auto 0;
            display: none;
        }


        /* دکمه توقف */

        .stop-button {
            margin-top: 15px;

            background-color: #e74c3c;
            color: white;

            border: none;
            padding: 11px 25px;

            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;

            transition: background-color 0.3s;
        }

        .stop-button:hover {
            background-color: #c0392b;
        }


        /* وضعیت پخش */

        #status {
            margin: 15px 0 0;
            color: #2c3e50;
            font-size: 14px;
            min-height: 22px;
        }

        #status.error {
            color: #e74c3c;
        }


        /* اکولایزر */

        .equalizer {
            height: 65px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;

            margin: 15px auto 5px;
            direction: ltr;
        }

        .equalizer span {
            display: block;

            width: 5px;
            height: 8px;

            background: #27ae60;
            border-radius: 5px;

            transform: scaleY(0.3);
            opacity: 0.4;
        }

        .equalizer.playing span {
            animation: equalizer 0.65s ease-in-out infinite alternate;
            opacity: 1;
        }

        .equalizer span:nth-child(1) {
            animation-delay: 0.1s;
        }

        .equalizer span:nth-child(2) {
            animation-delay: 0.4s;
        }

        .equalizer span:nth-child(3) {
            animation-delay: 0.2s;
        }

        .equalizer span:nth-child(4) {
            animation-delay: 0.5s;
        }

        .equalizer span:nth-child(5) {
            animation-delay: 0.15s;
        }

        .equalizer span:nth-child(6) {
            animation-delay: 0.35s;
        }

        .equalizer span:nth-child(7) {
            animation-delay: 0.25s;
        }

        .equalizer span:nth-child(8) {
            animation-delay: 0.45s;
        }

        .equalizer span:nth-child(9) {
            animation-delay: 0.1s;
        }

        .equalizer span:nth-child(10) {
            animation-delay: 0.3s;
        }

        .equalizer span:nth-child(11) {
            animation-delay: 0.5s;
        }

        .equalizer span:nth-child(12) {
            animation-delay: 0.2s;
        }

        @keyframes equalizer {

            0% {
                transform: scaleY(0.3);
            }

            50% {
                transform: scaleY(1);
            }

            100% {
                transform: scaleY(0.45);
            }

        }


        /* تبلت */

        @media (max-width: 900px) {

            body {
                grid-template-columns: 240px minmax(0, 1fr);
            }

            .sidebar {
                padding: 15px;
            }

            .main-content {
                padding: 15px;
            }

            .player-container {
                padding: 20px;
            }

        }


        /* گوشی و صفحه‌های کوچک */

        @media (max-width: 650px) {

            body {
                display: flex;
                flex-direction: column;
                min-height: 100dvh;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40dvh;
                padding: 12px 15px;
                overflow-y: auto;
                flex-shrink: 0;
            }

            .sidebar h1 {
                font-size: 19px;
                margin-bottom: 12px;
            }

            .channel-list li {
                padding: 8px 10px;
                margin-bottom: 7px;
            }

            .channel-list span {
                font-size: 13px;
            }

            .channel-list button {
                padding: 8px 15px;
            }

            .main-content {
                flex: 1;
                min-height: 60dvh;
                padding: 15px;

                display: flex;
                align-items: center;
                justify-content: center;
            }

            .player-container {
                max-width: 500px;
                padding: 18px;
            }

            .player-container h2 {
                font-size: 19px;
            }

            #radioLogo {
                width: 120px;
                height: 120px;
                margin-top: 15px;
            }

            .equalizer {
                height: 50px;
            }

        }


        /* گوشی در حالت افقی */

        @media (max-width: 900px) and (orientation: landscape) {

            body {
                display: grid;
                grid-template-columns: minmax(180px, 30%) minmax(0, 1fr);
            }

            .sidebar {
                height: 100dvh;
                max-height: none;
                overflow-y: auto;
                padding: 10px;
            }

            .sidebar h1 {
                font-size: 17px;
                margin-bottom: 10px;
            }

            .channel-list li {
                padding: 7px;
                margin-bottom: 6px;
            }

            .channel-list button {
                padding: 6px 10px;
            }

            .main-content {
                min-height: 100dvh;
                padding: 10px;
            }

            .player-container {
                padding: 12px;
                max-width: 500px;
            }

            .player-container h2 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            #radioLogo {
                width: 85px;
                height: 85px;
                margin-top: 8px;
            }

            .equalizer {
                height: 35px;
                margin: 5px auto;
            }

            .stop-button {
                margin-top: 8px;
                padding: 8px 18px;
            }

            #status {
                margin-top: 7px;
            }

        }


        /* پشتیبانی از کاهش حرکت */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }

        }

    </style>
</head>

<body>


    <!-- سایدبار -->

    <aside class="sidebar">

        <h1>کانال‌های رادیو</h1>

        <ul class="channel-list">

            <li>
                <span>رادیو دوشات</span>
                <button onclick="playRadio('http://185.137.24.213:8000/dsradio.mp3', 'رادیو دوشات', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7U84v-CHHdOvwYhpwAYsgFUojsVszpLldX8ZafOVpVw&s', this)">پخش</button>
            </li>

            <li>
                <span>رادیو PMC</span>
                <button onclick="playRadio('https://radiohls.pmc.live/hls/stream.m3u8', 'رادیو PMC', 'https://upload.wikimedia.org/wikipedia/en/thumb/1/1f/Persian_Media_Corporation.jpg/250px-Persian_Media_Corporation.jpg', this)">پخش</button>
            </li>

            <li>
                <span>رادیو سرچشمه</span>
                <button onclick="playRadio('https://sarcheshmeh.awsvps.com/stream', 'رادیو سرچشمه', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7C5eo_WL3eSE6PhLQECsw1ZbFNGmTEhrlaA&s', this)">پخش</button>
            </li>

            <li>
                <span>رادیو دربست</span>
                <button onclick="playRadio('https://live.radiodarbast.com/stream.mp3', 'رادیو دربست', 'https://s3.castbox.fm/00/ae/8d/a2b2094610b16434656b901f23.jpg', this)">پخش</button>
            </li>

            <li>
                <span>رادیو ونک</span>
                <button onclick="playRadio('https://s10.citrus3.com:8462/stream', 'رادیو ونک', 'https://i1.sndcdn.com/artworks-000531893307-yksiww-t500x500.jpg', this)">پخش</button>
            </li>

            <li>
                <span>رادیو شادی</span>
                <button onclick="playRadio('https://ice9.securenetsystems.net/SHADI', 'رادیو شادی', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJhGtmA08wjRZ8WRbSIgukNr4nNpGUVeSnUQ&s', this)">پخش</button>
            </li>

            <li>
                <span>رادیو جیبی</span>
                <button onclick="playRadio('https://radiolivestream.net/listen/radio/radio.mp3', 'رادیو جیبی', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNsG_vFO4dF9NRg5oTqtLV0sj1zoqdWdEL0kP0nKbveYeUKszGSg57kLk&s', this)">پخش</button>
            </li>

            <li>
                <span>رادیو نواهنگ</span>
                <button onclick="playRadio('https://play.markaradyo.com:8002/stream', 'رادیو نواهنگ', 'https://play-lh.googleusercontent.com/zMZP75NnLMgBigHG6aVdXMxPOZ3Dfalsxbmu7EjcMq1J4S8hxGGzn0hRfwjK7qlxirMZetuB1AX4tYuR19kv', this)">پخش</button>
            </li>

            <li>
                <span>رادیو ایران اینترنشنال</span>
                <button onclick="playRadio('https://n0c.radiojar.com/dfnrphnr5f0uv?rj-ttl=5', 'رادیو ایران اینترنشنال', 'https://kanaljavan.com/wp-content/uploads/2021/06/iranint800.jpg', this)">پخش</button>
            </li>

            <li>
                <span>رادیو ۶۷۰</span>
                <button onclick="playRadio('https://kirn.awsvps.com/KIRN', 'رادیو ۶۷۰', 'https://www.radio.net/300/kirn.png?version=d207b450aa1bf28c692aab83b2410670', this)">پخش</button>
            </li>

            <li>
                <span>24 ARABESK</span>
                <button onclick="playRadio('https://24arabesk.80.yayin.com.tr/stream/1/', '24 ARABESK', 'https://play-lh.googleusercontent.com/q0cPlPzG_bwNvJo7eh8FR-NykZYs8gtpQosUTMAcayThgUdrUt3hxWr51UtfQ9UBY-NoVZ0Yue8hwWEAT10Zlw', this)">پخش</button>
            </li>

            <li>
                <span>Super FM (Turkey)</span>
                <button onclick="playRadio('https://playerservices.streamtheworld.com/api/livestream-redirect/SUPER_FM.mp3', 'Super FM (Turkey)', 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTX3plIusoVomxU7qLlaUnTTi4xORqbcwN6XA&s', this)">پخش</button>
            </li>

        </ul>

    </aside>


    <!-- پلیر اصلی -->

    <main class="main-content">

        <div class="player-container">

            <h2 id="radioTitle">پخش زنده رادیو</h2>

            <audio
                id="radioPlayer"
                controls
                class="player"
                preload="none">
            </audio>


            <!-- اکولایزر -->

            <div class="equalizer" id="equalizer">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>


            <button
                class="stop-button"
                onclick="stopRadio()">
                توقف پخش
            </button>


            <p id="status">وضعیت: متوقف شده</p>


            <img
                id="radioLogo"
                src=""
                alt="لوگوی رادیو">

        </div>

    </main>


    <script>

        const player = document.getElementById('radioPlayer');

        const radioTitle = document.getElementById('radioTitle');

        const status = document.getElementById('status');

        const radioLogo = document.getElementById('radioLogo');

        const equalizer = document.getElementById('equalizer');

        let activeButton = null;


        // تغییر وضعیت نمایش

        function setStatus(message, error = false) {

            status.innerText = 'وضعیت: ' + message;

            status.classList.toggle('error', error);

        }


        // توقف اکولایزر

        function stopEqualizer() {

            equalizer.classList.remove('playing');

        }


        // فعال کردن اکولایزر

        function startEqualizer() {

            equalizer.classList.add('playing');

        }


        // پخش رادیو

        function playRadio(url, title, logoUrl, button) {

            // توقف پخش قبلی

            player.pause();

            player.removeAttribute('src');

            player.load();


            // حذف انتخاب قبلی

            document.querySelectorAll('.channel-list li').forEach(item => {

                item.classList.remove('active');

            });


            // انتخاب شبکه جدید

            if (button) {

                activeButton = button;

                button.closest('li').classList.add('active');

            }


            // تنظیم اطلاعات شبکه

            radioTitle.innerText = title;

            radioLogo.src = logoUrl;

            radioLogo.style.display = 'block';

            setStatus('در حال اتصال...');

            stopEqualizer();


            // تنظیم منبع جدید

            player.src = url;

            player.load();


            // شروع پخش

            const playPromise = player.play();


            if (playPromise !== undefined) {

                playPromise.catch(error => {

                    if (error.name !== 'AbortError') {

                        setStatus('خطا در شروع پخش', true);

                        stopEqualizer();

                    }

                });

            }

        }


        // پخش موفق

        player.addEventListener('playing', () => {

            setStatus('در حال پخش');

            startEqualizer();

        });


        // در حال بارگذاری

        player.addEventListener('waiting', () => {

            setStatus('در حال دریافت صدا...');

            stopEqualizer();

        });


        // توقف موقت

        player.addEventListener('pause', () => {

            if (player.src) {

                setStatus('متوقف شده');

            }

            stopEqualizer();

        });


        // خطای پخش

        player.addEventListener('error', () => {

            if (player.src) {

                setStatus('خطا در اتصال یا پخش این شبکه', true);

            }

            stopEqualizer();

        });


        // پایان پخش

        player.addEventListener('ended', () => {

            setStatus('پخش به پایان رسید');

            stopEqualizer();

        });


        // توقف کامل

        function stopRadio() {

            player.pause();

            player.removeAttribute('src');

            player.load();

            radioTitle.innerText = 'پخش زنده رادیو';

            radioLogo.style.display = 'none';

            setStatus('متوقف شده');

            stopEqualizer();


            document.querySelectorAll('.channel-list li').forEach(item => {

                item.classList.remove('active');

            });

            activeButton = null;

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>پخش کننده سریال تاکسی</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Noto Kufi Arabic", sans-serif; }
    :root { color-scheme: dark; }
    html, body { min-height: 100%; }
    body { background: #1a1a1a; color: #f0f0f0; min-height: 100vh; display: flex; flex-direction: column; }
    button { font: inherit; }
    .header { padding: 10px 15px; background: #222; border-bottom: 1px solid #333; display: flex; justify-content: flex-start; align-items: center; }
    .hamburger-btn { width: 42px; height: 42px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; cursor: pointer; padding: 8px; background: #333; border-radius: 5px; border: 0; color: white; z-index: 101; }
    .hamburger-line { width: 24px; height: 2px; background: #fff; border-radius: 2px; transition: .2s; }
    .hamburger-btn.active .hamburger-line:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger-btn.active .hamburger-line:nth-child(2) { opacity: 0; }
    .hamburger-btn.active .hamburger-line:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .series-title { text-align: center; padding: 12px 15px; font-size: 1.3rem; color: #fff; background: #222; }
    .content-wrapper { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 15px; }
    .video-container { width: 100%; margin: 0 auto; }
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 8px; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; outline: none; }
    .video-poster { position: absolute; inset: 0; width: 100%; height: 100%; background-image: url("https://media.mehrnews.com/d/2026/10/14/3/6218059.jpg?ts=1791975734977"); background-size: cover; background-position: center; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .video-poster::after { content: "▶"; font-size: 42px; color: #fff; background: rgba(0,0,0,.55); width: 78px; height: 78px; border-radius: 50%; display: flex; justify-content: center; align-items: center; padding-right: 4px; }
    .video-poster.hidden { display: none; }
    .video-controls { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .control-btn { background: #333; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .control-btn:active, .control-btn:hover { background: #444; }
    .status { margin-top: 12px; min-height: 28px; text-align: center; color: #ffcc80; font-size: .9rem; overflow-wrap: anywhere; }
    .playlist-container { position: fixed; top: 0; right: 0; width: min(350px, 88vw); height: 100dvh; background: rgba(37,37,37,.97); backdrop-filter: blur(10px); transition: transform .25s ease; overflow-y: auto; z-index: 100; padding: 70px 0 20px; border-left: 1px solid rgba(255,255,255,.1); transform: translateX(105%); }
    .playlist-container.active { transform: translateX(0); }
    .playlist { padding: 15px; }
    .playlist-heading { padding: 0 15px 10px; color: #ddd; }
    .playlist-item { display: block; width: 100%; text-align: right; padding: 12px 15px; margin-bottom: 8px; background: rgba(51,51,51,.9); color: #eee; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,.1); }
    .playlist-item:hover { background: #3a3a3a; }
    .playlist-item.active { background: #244b5b; border-color: #39758d; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; }
    .overlay.active { opacity: 1; visibility: visible; }
    @media (min-width: 768px) {
      .content-wrapper { padding: 24px; }
      .series-title { font-size: 1.5rem; padding: 15px; }
      .video-wrapper { aspect-ratio: 16 / 9; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header class="header">
    <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="باز و بسته کردن فهرست قسمت‌ها" aria-expanded="false">
      <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
    </button>
  </header>

  <div class="series-title">سریال تاکسی</div>

  <main class="content-wrapper">
    <section class="video-container" aria-label="پخش ویدیو">
      <div class="video-wrapper">
        <video id="video-player" controls playsinline preload="metadata"
          poster="https://media.mehrnews.com/d/2026/10/14/3/6218059.jpg?ts=1791975734977">
          مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
        </video>
        <div class="video-poster" id="video-poster" role="button" tabindex="0" aria-label="پخش ویدیو"></div>
      </div>
      <div class="video-controls">
        <button class="control-btn" id="play-btn" type="button">پخش</button>
        <button class="control-btn" id="pause-btn" type="button">توقف</button>
        <button class="control-btn" id="fullscreen-btn" type="button">تمام صفحه</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">برای شروع، روی پخش بزنید.</p>
    </section>
  </main>

  <aside class="playlist-container" id="playlist-container" aria-label="فهرست قسمت‌ها" aria-hidden="true">
    <div class="playlist-heading">فهرست قسمت‌ها</div>
    <div class="playlist" id="playlist"></div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const videoPlayer = document.getElementById("video-player");
      const videoPoster = document.getElementById("video-poster");
      const playBtn = document.getElementById("play-btn");
      const pauseBtn = document.getElementById("pause-btn");
      const fullscreenBtn = document.getElementById("fullscreen-btn");
      const hamburgerBtn = document.getElementById("hamburger-btn");
      const playlistContainer = document.getElementById("playlist-container");
      const playlist = document.getElementById("playlist");
      const overlay = document.getElementById("overlay");
      const status = document.getElementById("status");

      // آدرس قسمت‌ها را در همین آرایه اضافه کنید.
      const episodes = [
        {
          title: "قسمت اول",
          url: "https://cdn1.movieland.af/series2/2026/taksy/season_1/episode_1/taksy-s1-e1-720p-movieland.af.mp4"
        }
      ];

      function setStatus(message) {
        status.textContent = message;
      }

      function hidePoster() {
        videoPoster.classList.add("hidden");
      }

      function showPoster() {
        videoPoster.classList.remove("hidden");
      }

      function closeMenu() {
        hamburgerBtn.classList.remove("active");
        hamburgerBtn.setAttribute("aria-expanded", "false");
        playlistContainer.classList.remove("active");
        playlistContainer.setAttribute("aria-hidden", "true");
        overlay.classList.remove("active");
      }

      function toggleMenu() {
        const isOpen = !playlistContainer.classList.contains("active");
        playlistContainer.classList.toggle("active", isOpen);
        hamburgerBtn.classList.toggle("active", isOpen);
        hamburgerBtn.setAttribute("aria-expanded", String(isOpen));
        playlistContainer.setAttribute("aria-hidden", String(!isOpen));
        overlay.classList.toggle("active", isOpen);
      }

      function selectEpisode(episode, item) {
        document.querySelectorAll(".playlist-item").forEach(el => el.classList.remove("active"));
        item.classList.add("active");
        videoPlayer.pause();
        videoPlayer.removeAttribute("src");
        videoPlayer.src = episode.url;
        videoPlayer.load();
        showPoster();
        setStatus("در حال آماده‌سازی ویدیو...");
        closeMenu();
        window.scrollTo({ top: 0, behavior: "smooth" });

        // تلاش برای پخش پس از انتخاب کاربر؛ اگر سرور اجازه ندهد، خطا نمایش داده می‌شود.
        const playPromise = videoPlayer.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.then(() => {
            hidePoster();
            setStatus("");
          }).catch(() => {
            setStatus("پخش خودکار انجام نشد. دکمه پخش را بزنید؛ اگر باز هم اجرا نشد، لینک یا سرور ویدیو را بررسی کنید.");
          });
        }
      }

      episodes.forEach((episode, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "playlist-item";
        item.textContent = episode.title;
        item.addEventListener("click", () => selectEpisode(episode, item));
        playlist.appendChild(item);
        if (index === 0) {
          item.classList.add("active");
          videoPlayer.src = episode.url;
        }
      });

      videoPoster.addEventListener("click", () => {
        hidePoster();
        videoPlayer.play().then(() => setStatus("")).catch(() => {
          showPoster();
          setStatus("ویدیو پخش نشد. ممکن است لینک مستقیم در دسترس نباشد یا سرور درخواست پلیر را رد کند.");
        });
      });

      videoPoster.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          videoPoster.click();
        }
      });

      playBtn.addEventListener("click", () => {
        hidePoster();
        videoPlayer.play().then(() => setStatus("")).catch(() => {
          showPoster();
          setStatus("پخش ناموفق بود. لینک ویدیو یا دسترسی سرور را بررسی کنید.");
        });
      });

      pauseBtn.addEventListener("click", () => {
        videoPlayer.pause();
        setStatus("ویدیو متوقف شد.");
      });

      fullscreenBtn.addEventListener("click", async () => {
        try {
          if (videoPlayer.requestFullscreen) await videoPlayer.requestFullscreen();
          else if (videoPlayer.webkitEnterFullscreen) videoPlayer.webkitEnterFullscreen();
          else setStatus("تمام‌صفحه در این مرورگر پشتیبانی نمی‌شود.");
        } catch (error) {
          setStatus("امکان ورود به حالت تمام‌صفحه وجود ندارد.");
        }
      });

      videoPlayer.addEventListener("loadstart", () => setStatus("در حال اتصال به سرور ویدیو..."));
      videoPlayer.addEventListener("loadedmetadata", () => setStatus(""));
      videoPlayer.addEventListener("canplay", () => setStatus(""));
      videoPlayer.addEventListener("waiting", () => setStatus("در انتظار دریافت داده‌های ویدیو..."));
      videoPlayer.addEventListener("playing", () => {
        hidePoster();
        setStatus("");
      });
      videoPlayer.addEventListener("ended", () => {
        showPoster();
        setStatus("پخش این قسمت به پایان رسید.");
      });
      videoPlayer.addEventListener("error", () => {
        const error = videoPlayer.error;
        const code = error ? error.code : 0;
        const messages = {
          1: "بارگذاری ویدیو لغو شد.",
          2: "خطای شبکه هنگام دریافت ویدیو. اتصال یا سرور میزبان را بررسی کنید.",
          3: "مرورگر نتوانست فایل ویدیو را رمزگشایی کند؛ ممکن است کدک پشتیبانی نشود.",
          4: "منبع ویدیو قابل پخش نیست. لینک ممکن است خراب، مسدود یا دارای محدودیت دسترسی باشد."
        };
        showPoster();
        setStatus(messages[code] || "خطای نامشخص در پخش ویدیو. لینک مستقیم را بررسی کنید.");
        console.error("Video playback error:", { code, message: error ? error.message : "unknown", src: videoPlayer.currentSrc });
      });

      hamburgerBtn.addEventListener("click", toggleMenu);
      overlay.addEventListener("click", closeMenu);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") closeMenu();
      });
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پلیر استریم دارک</title>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

    <style>
        :root {
            --primary-color: #3b82f6;
            --control-bg: rgba(15, 23, 42, 0.9);
            --text-light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text-light);
        }

        .player-container {
            position: relative;
            width: calc(100% - 32px);
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        /* دکمه پخش مرکزی */

        .center-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255,255,255,0.8);
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            z-index: 3;
        }

        .center-play.hidden {
            display: none;
        }

        /* پیام وضعیت */

        .status-message {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 14px;
            border-radius: 6px;
            z-index: 5;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        /* کنترل ها */

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(
                to top,
                var(--control-bg),
                transparent
            );

            padding: 20px 15px 10px;

            display: flex;
            flex-direction: column;
            gap: 10px;

            opacity: 0;
            transition: opacity 0.3s ease;

            direction: ltr;
            z-index: 4;
        }

        .player-container:hover .controls,
        .player-container:focus-within .controls {
            opacity: 1;
        }

        /* نوار پیشرفت */

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-filled {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            border-radius: 3px;
        }

        /* دکمه ها */

        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            color: #fff;
        }

        .left-controls,
        .right-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: 50%;
        }

        button:hover {
            background: rgba(255,255,255,0.1);
            color: var(--primary-color);
        }

        .icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        .time-display {
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
            direction: ltr;
        }

        /* موبایل و صفحات لمسی */

        @media (hover: none) {
            .controls {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .player-container {
                width: 100%;
                border-radius: 0;
            }

            .controls {
                padding: 15px 10px 8px;
            }

            .icon {
                font-size: 1.2rem;
            }

            .time-display {
                font-size: 0.75rem;
            }

            .left-controls,
            .right-controls {
                gap: 10px;
            }

            .center-play {
                width: 58px;
                height: 58px;
            }
        }

        /* تمام صفحه */

        .player-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
            border-radius: 0;
        }

        .player-container:fullscreen video {
            width: 100%;
            height: 100%;
        }

        .player-container:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div class="player-container" id="playerContainer">

        <video
            id="video"
            playsinline
            preload="metadata"
        ></video>

        <button
            class="center-play"
            id="centerPlay"
            title="پخش"
        >▶</button>

        <div class="status-message" id="statusMessage"></div>

        <div class="controls">

            <div class="progress-bar" id="progressBar">
                <div
                    class="progress-filled"
                    id="progressFilled"
                ></div>
            </div>

            <div class="buttons-row">

                <div class="left-controls">

                    <button id="playPauseBtn" title="پخش / توقف">
                        ▶
                    </button>

                    <button id="rewindBtn" title="عقب ۱۰ ثانیه">
                        ⏪
                    </button>

                    <button id="forwardBtn" title="جلو ۱۰ ثانیه">
                        ⏩
                    </button>

                    <span class="time-display" id="timeDisplay">
                        0:00 / 0:00
                    </span>

                </div>

                <div class="right-controls">

                    <button id="fullscreenBtn" title="تمام صفحه">
                        ⛶
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script>

        // ======================================
        // آدرس فایل ویدیویی یا استریم
        // ======================================

        const videoSrc =
            'https://cdn1.movieland.af/series2/2026/taksy/season_1/episode_1/taksy-s1-e1-720p-movieland.af.mp4';


        // ======================================
        // عناصر صفحه
        // ======================================

        const video = document.getElementById('video');

        const playerContainer =
            document.getElementById('playerContainer');

        const playPauseBtn =
            document.getElementById('playPauseBtn');

        const centerPlay =
            document.getElementById('centerPlay');

        const rewindBtn =
            document.getElementById('rewindBtn');

        const forwardBtn =
            document.getElementById('forwardBtn');

        const fullscreenBtn =
            document.getElementById('fullscreenBtn');

        const progressBar =
            document.getElementById('progressBar');

        const progressFilled =
            document.getElementById('progressFilled');

        const timeDisplay =
            document.getElementById('timeDisplay');

        const statusMessage =
            document.getElementById('statusMessage');


        let hls = null;


        // ======================================
        // نمایش پیام
        // ======================================

        function showStatus(message) {
            statusMessage.textContent = message;
            statusMessage.classList.add('show');
        }

        function hideStatus() {
            statusMessage.classList.remove('show');
        }


        // ======================================
        // تشخیص نوع فایل
        // ======================================

        function getVideoType(url) {

            const cleanUrl = url.split('?')[0].toLowerCase();

            if (cleanUrl.endsWith('.m3u8')) {
                return 'hls';
            }

            if (cleanUrl.endsWith('.mp4')) {
                return 'mp4';
            }

            return 'unknown';
        }


        // ======================================
        // راه اندازی پلیر
        // ======================================

        function initPlayer() {

            const type = getVideoType(videoSrc);

            hideStatus();

            if (type === 'mp4') {

                // پخش مستقیم MP4

                video.src = videoSrc;
                video.load();

                console.log('MP4 player initialized');

            }

            else if (type === 'hls') {

                // پخش HLS با Hls.js

                if (typeof Hls !== 'undefined' && Hls.isSupported()) {

                    hls = new Hls();

                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        console.log('HLS ready');
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {

                        console.error('HLS Error:', data);

                        if (data.fatal) {

                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                                showStatus('خطا در اتصال به سرور');

                                hls.startLoad();

                            }

                            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                                showStatus('در حال بازیابی ویدیو...');

                                hls.recoverMediaError();

                            }

                            else {

                                showStatus('امکان پخش این استریم وجود ندارد');

                                hls.destroy();

                            }

                        }

                    });

                }

                // پخش بومی HLS

                else if (
                    video.canPlayType('application/vnd.apple.mpegurl')
                ) {

                    video.src = videoSrc;
                    video.load();

                }

                else {

                    showStatus('مرورگر از پخش HLS پشتیبانی نمی‌کند');

                }

            }

            else {

                showStatus('فرمت فایل شناسایی نشد');

            }

        }


        // ======================================
        // پخش و توقف
        // ======================================

        function togglePlay() {

            if (video.paused) {

                video.play().catch(function(error) {

                    console.error('Playback error:', error);

                    showStatus('پخش ویدیو ناموفق بود');

                });

            }

            else {

                video.pause();

            }

        }


        playPauseBtn.addEventListener('click', togglePlay);

        centerPlay.addEventListener('click', togglePlay);

        video.addEventListener('click', togglePlay);


        // ======================================
        // وضعیت دکمه پخش
        // ======================================

        video.addEventListener('play', function() {

            playPauseBtn.textContent = '⏸';

            centerPlay.classList.add('hidden');

            hideStatus();

        });

        video.addEventListener('pause', function() {

            playPauseBtn.textContent = '▶';

            centerPlay.classList.remove('hidden');

        });

        video.addEventListener('ended', function() {

            playPauseBtn.textContent = '▶';

            centerPlay.classList.remove('hidden');

        });


        // ======================================
        // وضعیت بارگذاری
        // ======================================

        video.addEventListener('waiting', function() {
            showStatus('در حال بارگذاری...');
        });

        video.addEventListener('playing', function() {
            hideStatus();
        });

        video.addEventListener('canplay', function() {
            hideStatus();
        });

        video.addEventListener('error', function() {

            console.error('Video error:', video.error);

            let message = 'خطا در پخش ویدیو';

            if (video.error) {

                switch (video.error.code) {

                    case 1:
                        message = 'بارگذاری ویدیو متوقف شد';
                        break;

                    case 2:
                        message = 'خطا در دریافت اطلاعات از سرور';
                        break;

                    case 3:
                        message = 'فرمت یا کدک ویدیو پشتیبانی نمی‌شود';
                        break;

                    case 4:
                        message = 'فایل ویدیویی قابل پخش نیست';
                        break;

                }

            }

            showStatus(message);

        });


        // ======================================
        // جلو و عقب
        // ======================================

        function skip(seconds) {

            if (Number.isFinite(video.duration)) {

                video.currentTime = Math.max(
                    0,
                    Math.min(
                        video.duration,
                        video.currentTime + seconds
                    )
                );

            }

        }

        rewindBtn.addEventListener('click', function() {
            skip(-10);
        });

        forwardBtn.addEventListener('click', function() {
            skip(10);
        });


        // ======================================
        // تمام صفحه
        // ======================================

        function toggleFullscreen() {

            if (!document.fullscreenElement) {

                if (playerContainer.requestFullscreen) {

                    playerContainer.requestFullscreen();

                }

                else if (playerContainer.webkitRequestFullscreen) {

                    playerContainer.webkitRequestFullscreen();

                }

            }

            else {

                if (document.exitFullscreen) {

                    document.exitFullscreen();

                }

            }

        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);


        // ======================================
        // زمان و نوار پیشرفت
        // ======================================

        function formatTime(seconds) {

            if (!Number.isFinite(seconds)) {
                return '0:00';
            }

            const m = Math.floor(seconds / 60);

            const s = Math.floor(seconds % 60);

            return `${m}:${s < 10 ? '0' : ''}${s}`;

        }


        function updateProgress() {

            if (Number.isFinite(video.duration) && video.duration > 0) {

                const percent =
                    (video.currentTime / video.duration) * 100;

                progressFilled.style.width = percent + '%';

                timeDisplay.textContent =
                    formatTime(video.currentTime) +
                    ' / ' +
                    formatTime(video.duration);

            }

        }

        video.addEventListener('timeupdate', updateProgress);

        video.addEventListener('loadedmetadata', updateProgress);


        // ======================================
        // جابجایی روی نوار پیشرفت
        // ======================================

        function seek(e) {

            if (!Number.isFinite(video.duration)) {
                return;
            }

            const rect = progressBar.getBoundingClientRect();

            const pos = Math.max(
                0,
                Math.min(1, (e.clientX - rect.left) / rect.width)
            );

            video.currentTime = pos * video.duration;

        }

        progressBar.addEventListener('click', seek);


        // ======================================
        // میانبرهای کیبورد
        // ======================================

        document.addEventListener('keydown', function(e) {

            if (
                e.target.tagName === 'INPUT' ||
                e.target.tagName === 'TEXTAREA'
            ) {
                return;
            }

            switch (e.key) {

                case ' ':
                case 'k':
                    e.preventDefault();
                    togglePlay();
                    break;

                case 'ArrowLeft':
                    skip(-10);
                    break;

                case 'ArrowRight':
                    skip(10);
                    break;

                case 'f':
                    toggleFullscreen();
                    break;

            }

        });


        // ======================================
        // شروع پلیر
        // ======================================

        initPlayer();

    </script>

</body>
</html>
